org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Версия Тропы. versionCode растёт с каждым выпуском: по нему приложение понимает, что вышло новое.
tropa.versionCode=11
tropa.versionName=0.2.6
# Файл с описанием последней версии (его выкладывает tools/release.sh).
tropa.updateUrl=https://github.com/nvsbunny/tropa/releases/latest/download/update.json
